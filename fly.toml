# Polygraph hosted deploy config — tenant-architecture.md §6.
#
# THE CRITICAL CONSTRAINT: SQLite on a volume means EXACTLY ONE machine,
# ALWAYS running. Two machines would each mount their own volume and diverge
# into two different databases. A stopped machine means no dispatcher tick
# and no monitoring — for a monitoring product, that is a total outage, not
# a cost saving. Never raise max_machines_running above 1 and never set
# auto_stop_machines to true.

app = "polygraph-fifteenth-morning"
primary_region = "iad" # pick the region nearest Bright Data's API for latency

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  POLYGRAPH_DB = "/data/polygraph.sqlite"
  POLYGRAPH_PUBLIC_ORIGIN = "https://polygraph-fifteenth-morning.fly.dev"
  POLYGRAPH_CONCURRENCY = "4"
  # Hackathon-only owned-fixture permit. heal.ts requires every gate below
  # plus the exact collector + URL allowlist before any Bright Data mutation.
  # The customer scheduler strips the process-wide heal gate, so connected
  # customer collectors never inherit this authority.
  POLYGRAPH_HEAL_ENABLED = "1"
  POLYGRAPH_DEMO_LIVE = "1"
  POLYGRAPH_DEMO_OWNED_FIXTURE_AUTOSAVE = "1"
  POLYGRAPH_DEMO_FIXTURE_REPO = "Jayanthkoppala/polygraph-version-shift-store"
  POLYGRAPH_DEMO_FIXTURE_WORKFLOW = "switch-version.yml"
  POLYGRAPH_DEMO_FIXTURE_URL = "https://polygraph-version-shift-store.vercel.app"
  POLYGRAPH_DEMO_COLLECTOR_ID = "c_mt3kif5w1ds27lttug"
  POLYGRAPH_DEMO_EXPECTED_SKU = "SKU-ASTER-001"
  POLYGRAPH_DEMO_EXPECTED_PRICE = "51.77"
  POLYGRAPH_DEMO_EXPECTED_CURRENCY = "GBP"
  POLYGRAPH_DEMO_EXPECTED_SYMBOL = "£"
  POLYGRAPH_DEMO_MAX_MISSIONS = "2"

  # POLYGRAPH_MASTER_KEY (and, only during a rotation,
  # POLYGRAPH_MASTER_KEY_PREVIOUS), BRIGHTDATA_API_KEY, and
  # POLYGRAPH_DEMO_GITHUB_TOKEN are set via `fly secrets set`, never here.

[mounts]
  source = "polygraph_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # a stopped machine means no dispatcher tick. Never true.
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1     # SQLite + volume = EXACTLY ONE. Never raise this.

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"
